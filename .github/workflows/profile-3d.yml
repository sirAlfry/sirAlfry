# Genera il grafico 3D dei contributi (cartella profile-3d-contrib/)
# Documentazione: https://github.com/yoshi389111/github-profile-3d-contrib

name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "43 3 * * *"      # una volta al giorno
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Genera gli SVG 3D
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit dei file generati
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib/
          git diff --cached --quiet || git commit -m "chore: aggiorna grafico 3D dei contributi"
          git push
